<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mission Pari UP | Direct DM Lounge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            pink: '#f43f5e',

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE COMPAT SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyAzeWPIBXMI4GUZFKEnWdpZS0NntYhpS3o",
        authDomain: "batch-13137.firebaseapp.com",
        databaseURL: "https://batch-13137-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "batch-13137",
        storageBucket: "batch-13137.firebasestorage.app",
        messagingSenderId: "275925595005",
        appId: "1:275925595005:web:3474e1820603eafcf81214",
        measurementId: "G-NZQZBMREFZ"

      firebase.initializeApp(firebaseConfig);

      let messaging = null;
      if ('serviceWorker' in navigator && firebase.messaging.isSupported()) {
          try {
              navigator.serviceWorker.register('/firebase-messaging-sw.js')
              .then((registration) => {
                  messaging = firebase.messaging();
                  messaging.useServiceWorker(registration);
              }).catch(err => console.log("SW Notice:", err));

              console.log("Messaging notice:", e);

    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .chat-bg {
            background-color: #efeae2;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 16px 16px;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .bubble-me { border-radius: 12px 12px 2px 12px; }
        .bubble-other { border-radius: 12px 12px 12px 2px; }

            padding-bottom: max(0.625rem, env(safe-area-inset-bottom));

</head>
<body class="bg-slate-100 text-gray-800 font-sans flex flex-col justify-between overflow-hidden">

    <!-- HEADER -->
    <header class="bg-white border-b border-gray-200 px-4 py-2 flex justify-between items-center shadow-sm shrink-0 z-30">
        <div class="flex items-center gap-3">
            <a href="fresh_2.html" class="p-2 text-gray-600 hover:text-brand-pink hover:bg-rose-50 rounded-full transition">
                <i class="fas fa-arrow-left text-lg"></i>
            </a>
            <div class="relative cursor-pointer" onclick="changeMyPhoneNumber()" title="Click to edit registered phone number">
                <img id="loungeUserAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80" class="w-10 h-10 rounded-full border border-rose-300 object-cover">
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
            </div>
            <div>
                <h1 id="chatHeaderTitle" class="font-bold text-sm md:text-base text-gray-800 leading-tight">Group Lounge</h1>
                <p id="chatHeaderSubtitle" class="text-[11px] text-emerald-600 font-medium flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> <span id="userMyPhoneLabel">Loading...</span>
                </p>
            </div>
        </div>

        <div class="flex items-center gap-1.5">
            <button onclick="changeMyPhoneNumber()" class="px-2 py-1 text-[11px] bg-rose-50 text-brand-pink font-bold rounded-lg border border-rose-200 hover:bg-rose-100">
                <i class="fas fa-id-card"></i> My ID
            </button>
            <button onclick="clearChatForMe()" class="p-2 text-gray-500 hover:text-red-500 hover:bg-red-50 rounded-full" title="Clear Chat">
                <i class="fas fa-broom"></i>
            </button>
        </div>
    </header>

    <!-- TABS BAR -->
    <div class="bg-white border-b border-gray-200 flex justify-around text-xs font-bold text-gray-600 shrink-0 z-30">
        <button id="tabLoungeBtn" onclick="switchTab('lounge')" class="flex-1 py-2.5 border-b-2 border-brand-pink text-brand-pink text-center flex items-center justify-center gap-1.5">
            <i class="fas fa-users text-sm"></i> Group Lounge
        </button>
        <button id="tabDmBtn" onclick="switchTab('dms')" class="flex-1 py-2.5 border-b-2 border-transparent hover:text-brand-pink text-center flex items-center justify-center gap-1.5 relative">
            <i class="fas fa-user-friends text-sm"></i> Private DMs
            <span id="unreadDmBadge" class="hidden absolute top-2 right-4 w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></span>
        </button>
    </div>

    <!-- MAIN CHAT CONTAINER -->
    <div class="flex-1 relative overflow-hidden flex flex-col min-h-0">
        
        <!-- DM PANEL (WhatsApp Style Persistent List) -->
        <div id="dmListPanel" class="hidden absolute inset-0 bg-white z-20 p-4 overflow-y-auto space-y-3">
            <div class="flex justify-between items-center mb-2">
                <div>
                    <h2 class="font-bold text-sm text-gray-800">Direct Messages</h2>
                    <p class="text-[10px] text-gray-400">Jo bhi aapko mssg karega wo yahan aayega</p>
                </div>
                <button onclick="openFindStudentModal()" class="bg-brand-pink text-white text-xs px-3.5 py-2 rounded-xl font-bold shadow hover:bg-rose-600 transition flex items-center gap-1.5">
                    <i class="fas fa-plus"></i> Start Chat
                </button>
            </div>
            <div id="dmRoomsContainer" class="space-y-2">
                <!-- Dynamic DM List -->
            </div>
        </div>

        <!-- CHAT MESSAGES BOX -->
        <main id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-3 chat-bg custom-scrollbar relative">
            <div class="text-center my-2">
                <span class="bg-white/90 text-gray-500 text-[11px] px-3 py-1 rounded-full shadow-sm border">🔒 Protected Discussion</span>
            </div>
        </main>
    </div>

    <!-- QUOTED REPLY PREVIEW BAR -->
    <div id="replyPreviewContainer" class="hidden px-4 py-2 bg-rose-50 border-t border-rose-200 flex items-center justify-between shrink-0">
        <div class="border-l-4 border-brand-pink pl-2 text-xs">
            <p id="replySender" class="font-bold text-brand-pink">Replying to User</p>
            <p id="replyText" class="text-gray-600 truncate max-w-xs md:max-w-md">Message text preview...</p>
        </div>
        <button onclick="cancelReply()" class="text-gray-400 hover:text-red-500 font-bold p-1">✕</button>
    </div>

    <!-- ATTACHMENT PREVIEW PANEL -->
    <div id="imagePreviewContainer" class="hidden px-4 py-2 bg-slate-100 border-t border-gray-200 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img id="imagePreview" src="" class="w-12 h-12 object-cover rounded-xl border border-brand-pink shadow-sm">
                <button onclick="clearImagePreview()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] font-bold shadow">✕</button>
            </div>
            <span class="text-xs text-emerald-600 font-bold">Image ready to send!</span>
        </div>
    </div>

    <!-- INPUT FOOTER (Fixed for Mobile Screens) -->
    <footer class="bg-white border-t border-gray-200 px-3 py-2 shrink-0 z-30 safe-bottom">
        <form id="chatForm" class="flex items-center gap-2 max-w-4xl mx-auto">
            <label for="chatImgInput" class="p-2 text-gray-500 hover:text-brand-pink hover:bg-rose-50 rounded-full cursor-pointer transition shrink-0">
                <i class="fas fa-paperclip text-lg"></i>
            </label>
            <input type="file" id="chatImgInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">

            <input type="text" id="msgInput" placeholder="Type a message..." class="flex-1 px-4 py-2 bg-gray-100 border-none rounded-full text-sm outline-none focus:ring-2 focus:ring-rose-400 transition min-w-0">

            <button type="submit" id="sendBtn" class="bg-brand-pink text-white w-9 h-9 rounded-full flex items-center justify-center shadow hover:bg-rose-600 transition shrink-0">
                <i class="fas fa-paper-plane text-xs"></i>
            </button>
        </form>
    </footer>

    <!-- FIND STUDENT MODAL -->
    <div id="findStudentModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-gray-800 text-sm">Send Message To Mobile Number</h3>
                <button onclick="closeFindStudentModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <div class="space-y-3">
                <label class="text-[11px] text-gray-500 block">Jiss number se samne wale ki ID bani hai wo yahan dalein:</label>
                <input type="tel" id="searchPhoneInput" placeholder="Enter 10-digit Mobile Number" class="w-full p-2.5 bg-gray-50 border rounded-xl text-sm outline-none focus:border-brand-pink">
                <button onclick="searchStudentByPhone()" class="w-full bg-brand-pink text-white py-2.5 rounded-xl font-bold text-xs shadow hover:bg-rose-600">
                    Open Chat Window 💬
                </button>
            </div>
            <div id="searchResults" class="pt-1"></div>
        </div>
    </div>

    <!-- LIGHTBOX MODAL -->
    <div id="lightboxModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4" onclick="closeLightbox()">
        <button class="absolute top-4 right-4 text-white text-2xl font-bold">&times;</button>
        <img id="lightboxImage" src="" class="max-w-full max-h-full object-contain rounded-lg">
    </div>

    <script>
        // Session setup
        let currentSession = JSON.parse(localStorage.getItem('mp_student_session'));
        if (!currentSession || !currentSession.phone || currentSession.phone.startsWith('user_')) {
            const phonePrompt = prompt("Aapka Mobile Number enter karein (Taaki DMs directly aapke paas aayein):", "9876543210");
            const cleanPhone = phonePrompt ? phonePrompt.trim() : '9876543210';
            currentSession = {
                name: 'Gaurav Yadav',
                phone: cleanPhone,
                avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80'
            };
            localStorage.setItem('mp_student_session', JSON.stringify(currentSession));
        }

        document.getElementById('loungeUserAvatar').src = currentSession.avatar;
        document.getElementById('userMyPhoneLabel').innerText = `My ID: ${currentSession.phone}`;

        // DB Student document auto register
        db.collection('students').doc(currentSession.phone).set({
            name: currentSession.name,
            phone: currentSession.phone,
            avatar: currentSession.avatar,
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        let activeRoomId = 'group_lounge';
        let currentPeerPhone = null;
        let currentPeerName = null;
        let currentPeerAvatar = null;
        let attachedBase64Image = null;
        let activeReplyData = null;
        let unsubscribeRealtime = null;

        // Initialize Lounge & Sync Realtime DMs
        listenToRoom('group_lounge');
        renderRecentChatList();
        syncRecentChatsFromFirestore();

        function changeMyPhoneNumber() {
            const newPhone = prompt("Apna registered mobile number update karein:", currentSession.phone);
            if (newPhone && newPhone.trim().length >= 10) {
                currentSession.phone = newPhone.trim();
                localStorage.setItem('mp_student_session', JSON.stringify(currentSession));
                document.getElementById('userMyPhoneLabel').innerText = `My ID: ${currentSession.phone}`;
                
                db.collection('students').doc(currentSession.phone).set({
                    name: currentSession.name,
                    phone: currentSession.phone,
                    avatar: currentSession.avatar
                }, { merge: true });

                syncRecentChatsFromFirestore();
                alert("Mobile Number updated to " + currentSession.phone);
            }
        }

        function switchTab(mode) {
            const loungeBtn = document.getElementById('tabLoungeBtn');
            const dmBtn = document.getElementById('tabDmBtn');
            const dmPanel = document.getElementById('dmListPanel');

            if (mode === 'lounge') {
                loungeBtn.className = "flex-1 py-2.5 border-b-2 border-brand-pink text-brand-pink text-center flex items-center justify-center gap-1.5";
                dmBtn.className = "flex-1 py-2.5 border-b-2 border-transparent hover:text-brand-pink text-center flex items-center justify-center gap-1.5 relative";
                dmPanel.classList.add('hidden');
                
                currentPeerPhone = null;
                document.getElementById('chatHeaderTitle').innerText = 'Group Lounge';
                document.getElementById('chatHeaderSubtitle').innerText = `My ID: ${currentSession.phone}`;
                listenToRoom('group_lounge');
            } else {
                dmBtn.className = "flex-1 py-2.5 border-b-2 border-brand-pink text-brand-pink text-center flex items-center justify-center gap-1.5 relative";
                loungeBtn.className = "flex-1 py-2.5 border-b-2 border-transparent hover:text-brand-pink text-center flex items-center justify-center gap-1.5";
                document.getElementById('unreadDmBadge').classList.add('hidden');
                renderRecentChatList();
                dmPanel.classList.remove('hidden');
            }
        }

        function getDmRoomId(phone1, phone2) {
            return [phone1, phone2].sort().join('_dm_');
        }

        function listenToRoom(roomId) {
            activeRoomId = roomId;
            if (unsubscribeRealtime) unsubscribeRealtime();

            const clearedAt = Number(localStorage.getItem(`clearedAt_${activeRoomId}_${currentSession.phone}`)) || 0;

            unsubscribeRealtime = db.collection('lounge_messages')
                .where('roomId', '==', activeRoomId)
                .onSnapshot(snapshot => {
                    const chatBox = document.getElementById('chatBox');
                    chatBox.innerHTML = `<div class="text-center my-2"><span class="bg-white/90 text-gray-500 text-[11px] px-3 py-1 rounded-full shadow-sm border">🔒 Protected Discussion</span></div>`;

                    let docs = [];
                    snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));

                    // Sort by time safely
                    docs.sort((a,b) => {
                        const tA = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate().getTime() : Date.now()) : Date.now();
                        const tB = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate().getTime() : Date.now()) : Date.now();
                        return tA - tB;
                    });

                    docs.forEach(msg => {
                        const msgTimeMillis = msg.createdAt ? (msg.createdAt.toDate ? msg.createdAt.toDate().getTime() : Date.now()) : Date.now();
                        if (msgTimeMillis <= clearedAt) return;

                        const isMe = msg.phone === currentSession.phone;
                        const msgTime = msg.createdAt && msg.createdAt.toDate ? new Date(msg.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Just now';

                        const messageHTML = `
                            <div class="flex gap-2 ${isMe ? 'justify-end' : 'justify-start'} items-end group my-1.5">
                                ${!isMe ? `<img src="${msg.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80'}" class="w-7 h-7 rounded-full object-cover shrink-0 mb-1 border">` : ''}

                                <div class="max-w-[80%] sm:max-w-[65%] space-y-1">
                                    <div class="p-2.5 text-xs shadow-sm relative ${isMe ? 'bg-brand-chatGreen text-gray-800 bubble-me' : 'bg-white text-gray-800 bubble-other border border-gray-100'}" onclick="setReplyTarget('${msg.id}', '${escapeHtml(msg.senderName || 'Student')}', '${escapeHtml(msg.text || 'Photo')}')">
                                        
                                        ${!isMe ? `<div class="font-bold text-[11px] text-brand-pink mb-1">${escapeHtml(msg.senderName || 'Student')}</div>` : ''}

                                        ${msg.replyTo ? `
                                            <div class="bg-black/5 border-l-2 border-brand-pink p-1.5 rounded text-[11px] mb-1.5">
                                                <b class="text-brand-pink block">${escapeHtml(msg.replyTo.senderName)}</b>
                                                <span class="text-gray-600 truncate block">${escapeHtml(msg.replyTo.text)}</span>
                                            </div>
                                        ` : ''}

                                        ${msg.imageUrl ? `
                                            <div class="overflow-hidden rounded-lg mb-1.5 cursor-pointer border border-black/5" onclick="openLightbox('${msg.imageUrl}')">
                                                <img src="${msg.imageUrl}" class="w-full max-h-56 object-cover hover:scale-105 transition duration-300">
                                            </div>
                                        ` : ''}

                                        ${msg.text ? `<p class="whitespace-pre-wrap leading-relaxed">${escapeHtml(msg.text)}</p>` : ''}

                                        <div class="flex items-center justify-end gap-1 text-[10px] text-gray-400 mt-1">
                                            <span>${msgTime}</span>
                                            ${isMe ? `<i class="fas fa-check-double text-blue-500 text-[11px]"></i>` : ''}
                                        </div>
                                    </div>
                                </div>

                                ${isMe ? `
                                    <button onclick="deleteMessageForEveryone('${msg.id}')" class="opacity-0 group-hover:opacity-100 transition text-gray-400 hover:text-red-500 text-xs p-1" title="Delete">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                ` : ''}
                            </div>
                        `;
                        chatBox.insertAdjacentHTML('beforeend', messageHTML);
                    });

                    chatBox.scrollTop = chatBox.scrollHeight;
                }, err => {
                    console.error("Firestore Listen Error:", err);
                });
        }

        // --- DIRECT DUAL ENGINE FOR RECENT CHATS ---
        function getSavedRecentChats() {
            try {
                const data = localStorage.getItem(`mp_recent_chats_${currentSession.phone}`);
                return data ? JSON.parse(data) : {};
            } catch(e) {
                return {};
            }
        }

        async function saveRecentChatBothUsers(targetPhone, targetName, targetAvatar, lastMsg) {
            if (!targetPhone || !currentSession.phone) return;

            // 1. Local Cache Update
            const chats = getSavedRecentChats();
            chats[targetPhone] = {
                phone: targetPhone,
                name: targetName || targetPhone,
                avatar: targetAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80',
                lastMessage: lastMsg || 'Tap to chat',
                updatedAt: Date.now()
            };
            localStorage.setItem(`mp_recent_chats_${currentSession.phone}`, JSON.stringify(chats));
            renderRecentChatList();

            // 2. Direct Sync to Both Users in Firestore
            try {
                // Sender's view
                db.collection('students').doc(currentSession.phone)
                  .collection('recent_chats').doc(targetPhone).set({
                      phone: targetPhone,
                      name: targetName || targetPhone,
                      avatar: targetAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80',
                      lastMessage: lastMsg || 'Tap to chat',
                      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                  }, { merge: true });

                // Receiver's view (INSTANT CHAT CARD CREATION FOR RECIPIENT)
                db.collection('students').doc(targetPhone)
                  .collection('recent_chats').doc(currentSession.phone).set({
                      phone: currentSession.phone,
                      name: currentSession.name || 'Student',
                      avatar: currentSession.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80',
                      lastMessage: lastMsg || 'Tap to chat',
                      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                  }, { merge: true });

            } catch(e) {
                console.error("Dual Sync Error:", e);
            }
        }

        function renderRecentChatList() {
            const container = document.getElementById('dmRoomsContainer');
            if (!container) return;

            const chatsObj = getSavedRecentChats();
            const chatsList = Object.values(chatsObj).sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));

            if (chatsList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 bg-slate-50 rounded-2xl border border-dashed border-gray-300">
                        <i class="fas fa-comments text-2xl text-gray-300 mb-2"></i>
                        <p class="text-xs text-gray-500 font-bold">Abhi koi private chat nahi hai</p>
                        <p class="text-[11px] text-gray-400 mt-1">Naye student ka mobile number daal kar seedha chat shuru karein!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            chatsList.forEach(chat => {
                const itemHTML = `
                    <div class="p-3 bg-white border border-gray-200 hover:bg-rose-50/70 rounded-2xl flex items-center justify-between cursor-pointer transition shadow-sm gap-3">
                        <div class="flex items-center gap-3 flex-1 overflow-hidden" onclick="openPrivateDmFromList('${chat.phone}', '${escapeHtml(chat.name)}', '${chat.avatar}')">
                            <img src="${chat.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80'}" class="w-11 h-11 rounded-full object-cover border border-rose-200 shrink-0">
                            <div class="truncate flex-1">
                                <div class="flex justify-between items-center">
                                    <p class="font-bold text-xs text-gray-800 truncate">${escapeHtml(chat.name)}</p>
                                    <span class="text-[10px] text-gray-400 font-medium">📱 ${chat.phone}</span>
                                </div>
                                <p class="text-[11px] text-brand-pink font-medium truncate mt-0.5">${escapeHtml(chat.lastMessage || 'Tap to open chat')}</p>
                            </div>
                        </div>
                        <button onclick="event.stopPropagation(); deleteRecentChat('${chat.phone}')" class="text-gray-300 hover:text-red-500 p-2 text-xs shrink-0 rounded-full hover:bg-red-50 transition" title="Delete">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', itemHTML);
            });
        }

        function openPrivateDmFromList(peerPhone, peerName, peerAvatar) {
            currentPeerPhone = peerPhone;
            currentPeerName = peerName;
            currentPeerAvatar = peerAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80';

            document.getElementById('dmListPanel').classList.add('hidden');
            
            document.getElementById('chatHeaderTitle').innerText = peerName;
            document.getElementById('chatHeaderSubtitle').innerText = `📱 Private Chat (${peerPhone})`;

            const roomId = getDmRoomId(currentSession.phone, peerPhone);
            listenToRoom(roomId);
        }

        function syncRecentChatsFromFirestore() {
            if (!currentSession.phone) return;
            try {
                db.collection('students').doc(currentSession.phone)
                  .collection('recent_chats')
                  .onSnapshot(snapshot => {
                      if (!snapshot) return;
                      const chats = getSavedRecentChats();
                      let hasNewMessage = false;

                      snapshot.forEach(doc => {
                          const data = doc.data();
                          if (data && data.phone) {
                              if (!chats[data.phone] || chats[data.phone].lastMessage !== data.lastMessage) {
                                  hasNewMessage = true;
                              }
                              chats[data.phone] = {
                                  phone: data.phone,
                                  name: data.name || data.phone,
                                  avatar: data.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80',
                                  lastMessage: data.lastMessage || 'Tap to chat',
                                  updatedAt: data.updatedAt && data.updatedAt.toDate ? data.updatedAt.toDate().getTime() : Date.now()
                              };
                          }
                      });
                      
                      localStorage.setItem(`mp_recent_chats_${currentSession.phone}`, JSON.stringify(chats));
                      renderRecentChatList();

                      if (hasNewMessage && document.getElementById('dmListPanel').classList.contains('hidden')) {
                          document.getElementById('unreadDmBadge').classList.remove('hidden');
                      }
                  }, err => console.log("Realtime sync listener:", err));
            } catch(e) {}
        }

        function deleteRecentChat(targetPhone) {
            if (confirm("Is chat ko recent list se hatayein?")) {
                const chats = getSavedRecentChats();
                delete chats[targetPhone];
                localStorage.setItem(`mp_recent_chats_${currentSession.phone}`, JSON.stringify(chats));
                renderRecentChatList();

                try {
                    db.collection('students').doc(currentSession.phone)
                      .collection('recent_chats').doc(targetPhone).delete();
                } catch(e){}

                if (currentPeerPhone === targetPhone) {
                    switchTab('lounge');
                }
            }
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxW = 500;
                    const scale = maxW / img.width;
                    canvas.width = (img.width > maxW) ? maxW : img.width;
                    canvas.height = (img.width > maxW) ? img.height * scale : img.height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    attachedBase64Image = canvas.toDataURL('image/jpeg', 0.5);
                    document.getElementById('imagePreview').src = attachedBase64Image;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
            };
            reader.readAsDataURL(file);
        }

        function clearImagePreview() {
            attachedBase64Image = null;
            document.getElementById('chatImgInput').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        function setReplyTarget(msgId, senderName, text) {
            activeReplyData = { msgId, senderName, text };
            document.getElementById('replySender').innerText = `Replying to ${senderName}`;
            document.getElementById('replyText').innerText = text;
            document.getElementById('replyPreviewContainer').classList.remove('hidden');
        }

        function cancelReply() {
            activeReplyData = null;
            document.getElementById('replyPreviewContainer').classList.add('hidden');
        }

        document.getElementById('chatForm').onsubmit = async function(e) {
            e.preventDefault();
            const textInput = document.getElementById('msgInput');
            const text = textInput.value.trim();

            if (!text && !attachedBase64Image) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                const newMsg = {
                    roomId: activeRoomId,
                    senderName: currentSession.name || 'Student',
                    phone: currentSession.phone || 'guest',
                    avatar: currentSession.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80',
                    text: text,
                    imageUrl: attachedBase64Image || null,
                    replyTo: activeReplyData || null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                await db.collection('lounge_messages').add(newMsg);

                if (currentPeerPhone) {
                    await saveRecentChatBothUsers(currentPeerPhone, currentPeerName, currentPeerAvatar, text || '📷 Photo Attachment');
                }

                textInput.value = '';
                clearImagePreview();
                cancelReply();
            } catch (err) {
                console.error("Send Message Error:", err);
                alert("Message send nahi hua: " + err.message);
            } finally {
                sendBtn.disabled = false;
            }
        };

        function clearChatForMe() {
            if (confirm("Screen se saare purane messages clear karein?")) {
                localStorage.setItem(`clearedAt_${activeRoomId}_${currentSession.phone}`, Date.now());
                listenToRoom(activeRoomId);
            }
        }

        async function deleteMessageForEveryone(docId) {
            if (confirm("Is message ko delete karein?")) {
                try {
                    await db.collection('lounge_messages').doc(docId).delete();
                } catch (err) {
                    alert("Delete failed: " + err.message);
                }
            }
        }

        function openFindStudentModal() { document.getElementById('findStudentModal').classList.remove('hidden'); }
        function closeFindStudentModal() { document.getElementById('findStudentModal').classList.add('hidden'); }

        async function searchStudentByPhone() {
            const phone = document.getElementById('searchPhoneInput').value.trim();
            const container = document.getElementById('searchResults');

            if (phone.length < 10) {
                container.innerHTML = '<p class="text-xs text-red-500">Kripya sahi 10-digit mobile number enter karein.</p>';
                return;
            }

            container.innerHTML = '<p class="text-xs text-gray-400">Database me profile dhund rahe hain...</p>';

            try {
                const doc = await db.collection('students').doc(phone).get();
                if (doc.exists) {
                    const s = doc.data();
                    const studentAvatar = s.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80';
                    const studentName = s.name || 'Student';

                    container.innerHTML = `
                        <div class="flex items-center justify-between p-2.5 bg-rose-50 rounded-xl border border-rose-200 mt-2">
                            <div class="flex items-center gap-2">
                                <img src="${studentAvatar}" class="w-9 h-9 rounded-full border object-cover">
                                <div>
                                    <p class="font-bold text-xs text-gray-800">${escapeHtml(studentName)}</p>
                                    <p class="text-[10px] text-gray-500">${phone}</p>
                                </div>
                            </div>
                            <button onclick="startPrivateDm('${phone}', '${escapeHtml(studentName)}', '${studentAvatar}')" class="bg-brand-pink text-white text-xs px-3.5 py-1.5 rounded-lg font-bold hover:bg-rose-600 transition">Start Chat</button>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border mt-2">
                            <div>
                                <p class="font-bold text-xs text-gray-800">Direct Number Chat</p>
                                <p class="text-[10px] text-gray-500">${phone}</p>
                            </div>
                            <button onclick="startPrivateDm('${phone}', '${phone}', '')" class="bg-brand-pink text-white text-xs px-3.5 py-1.5 rounded-lg font-bold">Start Chat</button>
                        </div>
                    `;
                }
            } catch (e) {
                startPrivateDm(phone, phone, '');
            }
        }

        function startPrivateDm(peerPhone, peerName, peerAvatar) {
            closeFindStudentModal();
            saveRecentChatBothUsers(peerPhone, peerName, peerAvatar, 'Chat Started');
            openPrivateDmFromList(peerPhone, peerName, peerAvatar);
        }

        function openLightbox(url) {
            document.getElementById('lightboxImage').src = url;
            document.getElementById('lightboxModal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        function escapeHtml(text) {
            if(!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
